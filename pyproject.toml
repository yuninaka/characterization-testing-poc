[project]
name = "characterization-testing-poc"
version = "0.1.0"
description = "消費税率変更対応案件のPhase0準備として、レガシーコードに対するCharacterization Testing（ゴールデンマスターテスト）の型を確立する実務ノートPoC"
authors = [
    { name = "Yunin", email = "yuninakamura2023@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "vulture",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PLR", "N", "B", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12

[tool.mypy]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
